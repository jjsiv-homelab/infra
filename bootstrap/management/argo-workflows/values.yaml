workflow:
  serviceAccount:
    create: true
  rbac:
    agentPermissions: true

controller:
  rbac:
    accessAllSecrets: true
    writeConfigMaps: true
  workflowNamespaces:
    - workflows
  logging:
    level: info
    format: "json"

server:
  authModes:
    - server
  logging:
    level: info
    format: "json"

  ingress:
    enabled: true
    ingressClassName: "cilium"
    hosts:
      - workflows.homelab.local
    tls:
      - hosts:
          - workflows.homelab.local
