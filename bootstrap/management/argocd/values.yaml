global:
  domain: argocd.homelab.local
  image:
    tag: v3.5.0-rc2

configs:
  cm:
    accounts.jjsiv: apiKey,login
    accounts.jjsiv.enabled: "true"
    accounts.crossplane: apiKey
    accounts.crossplane.enabled: "true"
    exec.enabled: true

    kustomize.buildOptions: "--enable-helm"

  params:
    application.namespaces: "tenant-*, argocd"
    server.insecure: true
    applicationsetcontroller.enable.progressive.syncs: true
    commitserver.log.level: debug
    hydrator.enabled: "true"
    controller.log.format: "json"
    server.log.format: "json"
    reposerver.log.format: "json"
    commitserver.log.format: "json"
    dexserver.log.format: "json"
    applicationsetcontroller.log.format: "json"
    notificationscontroller.log.format: "json"

  rbac:
    policy.csv: |
      g, jjsiv, role:admin
      g, crossplane, role:admin

server:
  ingress:
    enabled: true
    ingressClassName: cilium
    hostname: argocd.homelab.local
    tls: true
  certificate:
    enabled: true
    issuer:
      group: cert-manager.io
      kind: ClusterIssuer
      name: homelab-ca-issuer

commitServer:
  enabled: true
  metrics:
    enabled: true
