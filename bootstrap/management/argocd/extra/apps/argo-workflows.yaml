apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: argo-workflows
  namespace: argocd
spec:
  project: infrastructure
  destination:
    name: rpi
    namespace: argocd
  sources:
    - repoURL: https://argoproj.github.io/argo-helm
      chart: argo-workflows
      targetRevision: 1.0.*
      helm:
        ignoreMissingValueFiles: true
        releaseName: argo-workflows
        valueFiles:
          - $values/bootstrap/management/argo-workflows/values.yaml
    - repoURL: git@github.com:jjsiv-homelab/infra.git
      targetRevision: main
      ref: values
  syncPolicy:
    automated:
      selfHeal: true
      prune: true
    syncOptions:
      - ServerSideApply=true
      - CreateNamespace=true
