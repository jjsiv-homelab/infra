apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: cilium
  namespace: argocd
spec:
  goTemplate: true
  syncPolicy:
    preserveResourcesOnDeletion: true
  generators:
    - clusters:
        selector:
          matchLabels:
            addon/cilium: "true"
  template:
    metadata:
      name: "cilium-{{ .name }}"
      labels:
        addon: "cilium"
    spec:
      project: infrastructure
      destination:
        name: "{{ .name }}"
        namespace: kube-system
      sources:
        - repoURL: https://helm.cilium.io
          chart: cilium
          targetRevision: 1.19.*
          helm:
            ignoreMissingValueFiles: true
            releaseName: cilium
            valueFiles:
              - $values/bootstrap/addons/cilium/values.yaml
              - $values/bootstrap/addons/cilium/{{ .name }}/values.yaml
        - repoURL: git@github.com:jjsiv-homelab/infra.git
          targetRevision: main
          ref: values
        - repoURL: git@github.com:jjsiv-homelab/infra.git
          targetRevision: main
          path: bootstrap/addons/cilium/{{ .name }}
          directory:
            recurse: true
      syncPolicy:
        automated:
          selfHeal: true
          prune: true
        syncOptions:
          - ServerSideApply=true
          - CreateNamespace=true
