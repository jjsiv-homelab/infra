apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: grafana
  namespace: argocd
spec:
  goTemplate: true
  syncPolicy:
    preserveResourcesOnDeletion: false
  generators:
    - clusters:
        selector:
          matchLabels:
            addon/grafana: "true"
  template:
    metadata:
      name: "grafana-{{ .name }}"
      labels:
        addon: "grafana"
    spec:
      project: infrastructure
      destination:
        name: "{{ .name }}"
        namespace: monitoring
      sources:
        - repoURL: https://jjsiv-homelab.github.io/infra-helm-charts
          chart: grafana
          targetRevision: 0.*
          helm:
            ignoreMissingValueFiles: true
            releaseName: grafana
            valueFiles:
              - $values/bootstrap/addons/grafana/values.yaml
              - $values/bootstrap/addons/grafana/{{ .name }}/values.yaml
        - repoURL: git@github.com:jjsiv-homelab/infra.git
          targetRevision: main
          ref: values
      syncPolicy:
        automated:
          selfHeal: true
          prune: true
        syncOptions:
          - ServerSideApply=true
          - CreateNamespace=true
