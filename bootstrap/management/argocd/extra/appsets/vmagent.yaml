apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: vmagent
  namespace: argocd
spec:
  goTemplate: true
  syncPolicy:
    preserveResourcesOnDeletion: false
  generators:
    - clusters:
        selector:
          matchLabels:
            addon/vmagent: "true"
  template:
    metadata:
      name: "vmagent-{{ .name }}"
      labels:
        addon: "vmagent"
    spec:
      project: infrastructure
      destination:
        name: "{{ .name }}"
        namespace: monitoring
      sources:
        - repoURL: https://victoriametrics.github.io/helm-charts
          chart: victoria-metrics-agent
          targetRevision: 0.41.*
          helm:
            ignoreMissingValueFiles: true
            releaseName: victoria-metrics-agent
            valueFiles:
              - $values/bootstrap/addons/vmagent/values.yaml
              - $values/bootstrap/addons/vmagent/{{ .name }}/values.yaml
        - repoURL: git@github.com:jjsiv-homelab/infra.git
          targetRevision: main
          ref: values
      syncPolicy:
        automated:
          selfHeal: true
          prune: true
        syncOptions:
          - ServerSideApply=true
          - CreateNamespace=true
