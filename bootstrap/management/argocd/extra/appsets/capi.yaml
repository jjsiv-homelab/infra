apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: capi-operator
  namespace: argocd
spec:
  project: infrastructure
  destination:
    name: rpi
    namespace: capi-operator-system
  source:
    repoURL: git@github.com:jjsiv-homelab/infra.git
    targetRevision: main
    path: bootstrap/management/capi
  syncPolicy:
    automated:
      selfHeal: true
      prune: true
    syncOptions:
      - ServerSideApply=true
      - CreateNamespace=true
