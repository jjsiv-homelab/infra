apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: capi-operator
  namespace: argocd
spec:
  project: infrastructure
  destination:
    name: rpi
    namespace: capi-operator-system
  sources:
    - repoURL: https://kubernetes-sigs.github.io/cluster-api-operator
      chart: cluster-api-operator
      targetRevision: 0.24.*
      helm:
        ignoreMissingValueFiles: true
        releaseName: capi-operator
        valueFiles:
          - $values/bootstrap/management/capi/values.yaml
    - repoURL: git@github.com:jjsiv-homelab/infra.git
      targetRevision: main
      ref: values
    - repoURL: git@github.com:jjsiv-homelab/infra.git
      targetRevision: main
      path: bootstrap/management/capi/extra
      directory:
        recurse: true
  syncPolicy:
    automated:
      selfHeal: true
      prune: true
    syncOptions:
      - ServerSideApply=true
      - CreateNamespace=true
