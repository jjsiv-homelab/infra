apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: kagent
  namespace: argocd
spec:
  goTemplate: true
  syncPolicy:
    preserveResourcesOnDeletion: false
  generators:
    - clusters:
        selector:
          matchLabels:
            addon/kagent: "true"
  template:
    metadata:
      name: "kagent-{{ .name }}"
      labels:
        addon: "kagent"
    spec:
      project: infrastructure
      destination:
        name: "{{ .name }}"
        namespace: kagent
      sources:
        - repoURL: ghcr.io/kagent-dev/kagent/helm
          chart: kagent-crds
          targetRevision: 0.7.*
          helm:
            ignoreMissingValueFiles: true
            releaseName: kagent-crds
            valueFiles:
              - $values/bootstrap/addons/kagent/values-crds.yaml
              - $values/bootstrap/addons/kagent/{{ .name }}/values-crds.yaml
        - repoURL: ghcr.io/kagent-dev/kagent/helm
          chart: kagent
          targetRevision: 0.7.*
          helm:
            ignoreMissingValueFiles: true
            releaseName: kagent
            valueFiles:
              - $values/bootstrap/addons/kagent/values.yaml
              - $values/bootstrap/addons/kagent/{{ .name }}/values.yaml
        - repoURL: git@github.com:jjsiv-homelab/infra.git
          targetRevision: main
          ref: values
        - repoURL: git@github.com:jjsiv-homelab/infra.git
          targetRevision: main
          path: bootstrap/addons/kagent/{{ .name }}
          directory:
            recurse: true
      syncPolicy:
        automated:
          selfHeal: true
          prune: true
        syncOptions:
          - ServerSideApply=true
          - CreateNamespace=true
