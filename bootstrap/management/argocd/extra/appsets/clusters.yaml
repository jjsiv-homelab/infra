apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: clusters
  namespace: argocd
spec:
  goTemplate: true
  syncPolicy:
    preserveResourcesOnDeletion: true
  generators:
    - git:
        repoURL: git@github.com:jjsiv-homelab/infra.git
        revision: HEAD
        files:
          - path: bootstrap/clusters/common.yaml
            exclude: true
          - path: bootstrap/clusters/*/common.yaml
            exclude: true
          - path: bootstrap/clusters/*/*.yaml
        values:
          infrastructure: "{{ index .path.segments 2 }}"
          cluster: "{{ index .path.segments 3 | trimSuffix '.yaml' }}"
  template:
    metadata:
      name: "cluster-{{ .values.cluster }}"
      labels:
        infrastructure: "{{ .values.infrastructure }}"
    spec:
      project: infrastructure
      destination:
        name: "rpi"
        namespace: argocd
      sources:
        - repoURL: https://jjsiv-homelab.github.io/infra-helm-charts
          chart: cluster
          targetRevision: 1.*
          helm:
            ignoreMissingValueFiles: true
            releaseName: "{{ .values.cluster }}"
            valueFiles:
              - $values/bootstrap/clusters/common.yaml
              - $values/bootstrap/clusters/{{ .values.infrastructure }}/common.yaml
              - $values/bootstrap/clusters/{{ .values.infrastructure }}/{{ .values.cluster }}.yaml
        - repoURL: git@github.com:jjsiv-homelab/infra.git
          targetRevision: main
          ref: values
      syncPolicy:
        automated:
          selfHeal: true
          prune: true
        syncOptions:
          - ServerSideApply=true
          - CreateNamespace=true
