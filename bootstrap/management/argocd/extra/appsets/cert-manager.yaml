apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: cert-manager
  namespace: argocd
spec:
  goTemplate: true
  syncPolicy:
    preserveResourcesOnDeletion: true
  generators:
    - clusters:
        selector:
          matchLabels:
            addon/cert-manager: "true"
  template:
    metadata:
      name: "cert-manager-{{ .name }}"
      labels:
        addon: "cert-manager"
    spec:
      project: infrastructure
      destination:
        name: "{{ .name }}"
        namespace: cert-manager
      sources:
        - repoURL: https://charts.jetstack.io
          chart: cert-manager
          targetRevision: 1.19.*
          helm:
            ignoreMissingValueFiles: true
            releaseName: cert-manager
            valueFiles:
              - $values/bootstrap/addons/cert-manager/values.yaml
              - $values/bootstrap/addons/cert-manager/{{ .name }}/values.yaml
        - repoURL: git@github.com:jjsiv-homelab/infra.git
          targetRevision: main
          ref: values
        - repoURL: git@github.com:jjsiv-homelab/infra.git
          targetRevision: main
          path: bootstrap/addons/cert-manager/{{ .name }}
          directory:
            recurse: true
      syncPolicy:
        automated:
          selfHeal: true
          prune: true
        syncOptions:
          - ServerSideApply=true
          - CreateNamespace=true
