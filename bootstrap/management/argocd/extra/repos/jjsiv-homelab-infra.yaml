apiVersion: repositories.argocd.crossplane.io/v1alpha1
kind: Repository
metadata:
  name: jjsiv-homelab-infra
  namespace: argocd
spec:
  forProvider:
    sshPrivateKeyRef:
      key: key
      name: jjsiv-homelab-ssh
      namespace: crossplane-system
    repo: git@github.com:jjsiv-homelab/infra.git
    type: git
  providerConfigRef:
    name: argocd-provider
