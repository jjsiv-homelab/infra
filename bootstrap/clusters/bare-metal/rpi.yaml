# yaml-language-server: $schema=https://github.com/jjsiv-homelab/infra-helm-charts/raw/refs/heads/main/cluster/values.schema.json

name: rpi
server: https://kubernetes.default.svc

argocdConnections:
  central:
    config:
      tlsClientConfig:
        insecure: true

addons:
  grafana-operator:
    enabled: true
  grafana:
    enabled: true
  kagent:
    enabled: false
  opentelemetry:
    enabled: true
