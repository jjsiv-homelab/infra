database:
  postgres:
    url: postgres://kagent:kagent@postgres.kagent.svc.cluster.local:5432/postgres
    vectorEnabled: false

providers:
  default: openAI
  openAI:
    provider: OpenAI
    model: "gpt-4.1-mini"
    apiKeySecretRef: openai-api-key
    apiKeySecretKey: OPENAI_API_KEY
  ollama:
  anthropic:
    provider: Anthropic
    model: "claude-sonnet-4.6"
    apiKeySecretRef: anthropic-api-key
    apiKeySecretKey: API_KEY
  azureOpenAI:
  gemini:

kmcp:
  enabled: false
kagent-tools:
  enabled: true

agents:
  k8s-agent:
    enabled: true
    modelConfigRef: anthropic-claude-sonnet-4.6
    resources:
      requests:
        cpu: 100m
        memory: 256Mi
      limits:
        cpu: 1000m
        memory: 1Gi
  kgateway-agent:
    enabled: false
  istio-agent:
    enabled: false
  promql-agent:
    enabled: false
  observability-agent:
    enabled: false
  argo-rollouts-agent:
    enabled: false
  helm-agent:
    enabled: false
  cilium-policy-agent:
    enabled: false
  cilium-manager-agent:
    enabled: false
  cilium-debug-agent:
    enabled: false

tools:
  grafana-mcp:
    enabled: false
  querydoc:
    enabled: false
