apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: homelab-ca-bootstrap
spec:
  selfSigned: {}

---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: homelab-ca-root
  namespace: cert-manager
spec:
  isCA: true
  commonName: homelab.local
  secretName: homelab-ca-root
  privateKey:
    algorithm: ECDSA
    size: 256
  issuerRef:
    name: homelab-ca-bootstrap
    kind: ClusterIssuer
    group: cert-manager.io

---
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: homelab-ca-issuer
spec:
  ca:
    secretName: homelab-ca-root
