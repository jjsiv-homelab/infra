cluster:
  name: rpi
  id: 1

k8sServiceHost: 192.168.55.235

ipam:
  operator:
    clusterPoolIPv4PodCIDRList: ["10.100.0.0/16"]
    clusterPoolIPv4MaskSize: 24

ingressController:
  enabled: true
  default: true
  loadbalancerMode: shared
  defaultSecretNamespace: kube-system
  defaultSecretName: ingress-default-tls
  service:
    loadBalancerIP: 10.21.37.10
    labels:
      ip-pool: main
      announce: "true"

l2announcements:
  enabled: true
