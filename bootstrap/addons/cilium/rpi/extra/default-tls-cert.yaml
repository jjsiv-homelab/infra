apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: ingress-default-tls
  namespace: kube-system
spec:
  commonName: "*.homelab.local"
  secretName: ingress-default-tls
  privateKey:
    algorithm: ECDSA
    size: 256
  issuerRef:
    name: homelab-ca-issuer
    kind: ClusterIssuer
    group: cert-manager.io
