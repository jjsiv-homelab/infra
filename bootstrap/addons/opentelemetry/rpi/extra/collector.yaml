apiVersion: opentelemetry.io/v1beta1
kind: OpenTelemetryCollector
metadata:
  name: opentelemetry
  namespace: monitoring
spec:
  mode: daemonset
  tolerations:
    - key: node-role.kubernetes.io/control-plane
      operator: Exists
      effect: NoSchedule
  volumeMounts:
    - name: varlogpods
      mountPath: /var/log/pods
      readOnly: true
  volumes:
    - name: varlogpods
      hostPath:
        path: /var/log/pods
  config:
    receivers:
      file_log/default:
        include:
          - /var/log/pods/*/*/*.log
        start_at: end
        include_file_path: true
        include_file_name: false
        operators:
          - type: container
          - type: recombine
            combine_field: body
            is_first_entry: 'body matches "^[^\\s]"'
            source_identifier: attributes["log.file.path"]
          - type: json_parser
            if: 'body matches "^\\s*\\{"'
          - type: key_value_parser
            # Skip klog
            if: 'body matches "[a-zA-Z_]+=\\S+" and body not matches "^[IWEF]\\d{4}\\s+\\d{2}:\\d{2}:\\d{2}"'
          - type: severity_parser
            parse_from: attributes.level
            if: attributes.level != nil
      otlp/default:
        protocols:
          grpc:
            endpoint: 0.0.0.0:4317
          http:
            endpoint: 0.0.0.0:4318

    processors:
      k8s_attributes:
        extract:
          annotations:
            - key: homelab.local/collect-logs
              from: pod
              tag_name: k8s.pod.annotations.collect-logs
            - key: homelab.local/collect-logs
              from: namespace
              tag_name: k8s.namespace.annotations.collect-logs

      filter/require_opt_in:
        error_mode: ignore
        log_conditions:
          - 'resource.attributes["k8s.namespace.annotations.collect-logs"] != "true"'

    exporters:
      otlp_http/victorialogs:
        logs_endpoint: http://192.168.55.10:9428/insert/opentelemetry/v1/logs
      otlp_http/victoriametrics:
        metrics_endpoint: http://192.168.55.10:8428/api/v1/write
      otlp_http/victoriatraces:
        traces_endpoint: http://192.168.55.10:10428/insert/opentelemetry/v1/traces
    service:
      telemetry:
        logs:
          encoding: json
          processors:
            - batch:
                exporter:
                  otlp:
                    protocol: http/protobuf
                    endpoint: http://192.168.55.10:9428/insert/opentelemetry/v1/logs
      pipelines:
        logs/file:
          receivers:
            - file_log/default
          processors:
            - k8s_attributes
            - filter/require_opt_in
          exporters:
            - otlp_http/victorialogs
        logs/otlp:
          receivers:
            - otlp/default
          exporters:
            - otlp_http/victorialogs
        metrics:
          receivers:
            - otlp/default
          exporters:
            - otlp_http/victoriametrics
        traces:
          receivers:
            - otlp/default
          exporters:
            - otlp_http/victoriatraces
