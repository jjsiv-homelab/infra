apiVersion: opentelemetry.io/v1beta1
kind: OpenTelemetryCollector
metadata:
  name: opentelemetry
  namespace: monitoring
spec:
  mode: daemonset
  tolerations:
    - key: node-role.kubernetes.io/control-plane
      operator: Exists
      effect: NoSchedule
  volumeMounts:
    - name: varlogpods
      mountPath: /var/log/pods
      readOnly: true
  volumes:
    - name: varlogpods
      hostPath:
        path: /var/log/pods
  config:
    receivers:
      otlp/default:
        protocols:
          grpc:
            endpoint: 0.0.0.0:4317
          http:
            endpoint: 0.0.0.0:4318

    connectors:
      service_graph:
        dimensions:
          - db.system
          - messaging.system
        virtual_node_peer_attributes:
          - db.name
          - db.system
          - messaging.system
          - peer.service
        virtual_node_extra_label: true

    exporters:
      otlp_http/victorialogs:
        logs_endpoint: http://192.168.55.10:9428/insert/opentelemetry/v1/logs
      otlp_http/victoriametrics:
        metrics_endpoint: http://192.168.55.10:8428/api/v1/write
      otlp_http/victoriatraces:
        traces_endpoint: http://192.168.55.10:10428/insert/opentelemetry/v1/traces
      prometheus/servicegraph:
        endpoint: 0.0.0.0:9090
        namespace: servicegraph
    service:
      telemetry:
        logs:
          encoding: json
          processors:
            - batch:
                exporter:
                  otlp:
                    protocol: http/protobuf
                    endpoint: http://192.168.55.10:9428/insert/opentelemetry/v1/logs
      pipelines:
        logs/otlp:
          receivers:
            - otlp/default
          exporters:
            - otlp_http/victorialogs
        metrics:
          receivers:
            - otlp/default
          exporters:
            - otlp_http/victoriametrics
        metrics/servicegraph:
          receivers:
            - service_graph
          exporters:
            - prometheus/servicegraph
        traces:
          receivers:
            - otlp/default
          exporters:
            - otlp_http/victoriatraces
            - service_graph
