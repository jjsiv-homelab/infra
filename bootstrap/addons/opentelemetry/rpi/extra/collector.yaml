apiVersion: opentelemetry.io/v1beta1
kind: OpenTelemetryCollector
metadata:
  name: opentelemetry-collector
  namespace: monitoring
spec:
  mode: daemonset
  tolerations:
    - key: node-role.kubernetes.io/control-plane
      operator: Exists
      effect: NoSchedule
  volumeMounts:
    - name: varlogpods
      mountPath: /var/log/pods
      readOnly: true
  volumes:
    - name: varlogpods
      hostPath:
        path: /var/log/pods
  config:
    receivers:
      file_log/argocd:
        include:
          - /var/log/pods/argocd_*/*/*.log
        start_at: end
        include_file_path: true
        include_file_name: false
        operators:
          - type: container
            id: container-parser
          - type: severity_parser
            parse_from: body.level
      file_log/default:
        include:
          - /var/log/pods/*/*/*.log
        exclude:
          - /var/log/pods/argocd_*/*/*.log
        start_at: end
        include_file_path: true
        include_file_name: false
        operators:
          - type: container
            id: container-parser
      otlp:
        protocols:
          grpc:
            endpoint: 0.0.0.0:4317
          http:
            endpoint: 0.0.0.0:4318

    exporters:
      otlphttp/default:
        logs_endpoint: http://192.168.55.10:9428/insert/opentelemetry/v1/logs
      otlphttp/argocd:
        logs_endpoint: http://192.168.55.10:9428/insert/opentelemetry/v1/logs
        headers:
          AccountID: "1"
          ProjectID: "1"
    service:
      pipelines:
        logs/argocd:
          receivers: [file_log/argocd]
          exporters: [otlphttp/argocd]
        logs/default:
          receivers: [file_log/default, otlp]
          exporters: [otlphttp/default]
