apiVersion: opentelemetry.io/v1beta1
kind: OpenTelemetryCollector
metadata:
  name: servicegraph
  namespace: monitoring
spec:
  mode: statefulset
  replicas: 1
  tolerations:
    - key: node-role.kubernetes.io/control-plane
      operator: Exists
      effect: NoSchedule
  observability:
    metrics:
      enableMetrics: true
  config:
    receivers:
      otlp:
        protocols:
          grpc:
            endpoint: 0.0.0.0:4317
          http:
            endpoint: 0.0.0.0:4318

    connectors:
      service_graph:
        dimensions:
          - db.system.name
          - messaging.system
        virtual_node_peer_attributes:
          - db.system.name
          - messaging.system
          - peer.service
        virtual_node_extra_label: true
        database_name_attributes:
          - db.namespace
          - db.name

    exporters:
      otlp_http/victoriametrics:
        compression: gzip
        encoding: proto
        metrics_endpoint: http://192.168.55.10:8428/opentelemetry/v1/metrics
      prometheus/servicegraph:
        endpoint: 0.0.0.0:10223
    service:
      telemetry:
        logs:
          level: DEBUG
          encoding: json
          processors:
            - batch:
                exporter:
                  otlp:
                    protocol: http/protobuf
                    endpoint: http://192.168.55.10:9428/insert/opentelemetry/v1/logs
      pipelines:
        metrics:
          receivers:
            - service_graph
          exporters:
            - prometheus/servicegraph
            - otlp_http/victoriametrics
        traces:
          receivers:
            - otlp
          exporters:
            - service_graph
