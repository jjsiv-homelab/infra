version: v1alpha1
debug: false
persist: true
machine:
  network:
    nameservers:
      - 8.8.8.8
      - 8.8.4.4
  kubelet:
    defaultRuntimeSeccompProfileEnabled: true
    extraConfig:
      serverTLSBootstrap: true
  install:
    disk: /dev/sda
    wipe: false
  features:
    rbac: true
    stableHostname: true
    apidCheckExtKeyUsage: true
    diskQuotaSupport: true
    kubePrism:
      enabled: true
      port: 7445
    hostDNS:
      enabled: true
      forwardKubeDNSToHost: true
cluster:
  network:
    dnsDomain: cluster.local
    podSubnets:
      - 10.100.0.0/16
    serviceSubnets:
      - 172.20.0.0/16
